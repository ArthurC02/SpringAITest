spring:
  application:
    name: springaitest

  # ---- 資料層：H2 記憶體資料庫 ----
  datasource:
    url: jdbc:h2:mem:springaitest;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update      # 啟動時自動建表（示範用；正式環境建議改用 Flyway/Liquibase）
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true         # 瀏覽器開 http://localhost:8080/h2-console 可查看資料
      path: /h2-console

  # ---- Spring AI：透過 LiteLLM 閘道（OpenAI 相容協定）----
  ai:
    openai:
      base-url: ${LLM_BASE_URL:http://localhost:4000}   # 指向 LiteLLM，而非直連 OpenAI
      api-key: ${LITELLM_KEY:sk-1234}                   # LiteLLM 虛擬金鑰（非真正的 OpenAI 金鑰）
      chat:
        options:
          model: gpt-4o-mini    # 必須是 litellm-config.yaml 裡的 model_name
          temperature: 0.7
    # ---- 觀測：把 prompt / completion 納入觀測（會輸出敏感內容，僅開發用）----
    chat:
      client:
        observations:
          log-prompt: true
      observations:
        log-prompt: true
        log-completion: true
        include-error-logging: true

# ---- mem0：長期記憶 REST server（mem0/mem0-api-server）----
mem0:
  # 主機開發時走 localhost:8000；full profile 容器化時由 compose 覆寫成 http://mem0:8000
  base-url: ${MEM0_BASE_URL:http://localhost:8000}

server:
  port: 8080

# ---- 可觀測性：Micrometer Tracing → OTLP → Langfuse ----
management:
  tracing:
    sampling:
      probability: 1.0        # 開發期全量取樣；正式環境請調低
  otlp:
    tracing:
      # Langfuse 的 OTLP/HTTP traces 端點
      endpoint: ${LANGFUSE_OTEL_ENDPOINT:http://localhost:3000/api/public/otel/v1/traces}
      headers:
        # Basic base64(public_key:secret_key)；對應 .env 的預設金鑰
        Authorization: ${LANGFUSE_OTEL_AUTH:Basic cGstbGYtMTIzNDU2Nzg5MDpzay1sZi0xMjM0NTY3ODkw}

logging:
  level:
    org.springframework.ai: INFO

# ---- 工作流服務（Python/LangGraph，經 HTTP 觸發）----
workflow:
  # 主機開發時走 localhost:8001（compose 把工作流容器的 :8000 發佈到主機 :8001，因 :8000 已被 mem0 佔用）
  base-url: ${WORKFLOW_BASE_URL:http://localhost:8001}
  # 內部服務間權杖：Spring 呼叫下游 /workflows*、/documents* 時一併帶上，供下游驗證呼叫來源
  internal-token: ${INTERNAL_API_TOKEN:internal-dev-token}

# ---- JWT 簽發設定（登入後由 web 層簽發，其餘 API 皆需帶 Bearer token）----
jwt:
  secret: ${JWT_SECRET:dev-jwt-secret-change-me-0123456789abcdef}
  expiration-hours: 24

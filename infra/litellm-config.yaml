# LiteLLM 閘道設定。platform（.NET）的 CHAT_MODEL env 要對應這裡的 model_name。
model_list:
  - model_name: gpt-4o-mini            # ← platform 的 CHAT_MODEL env 預設值（docker-compose.yml / AGENTS.md）
    litellm_params:
      model: openai/gpt-4o-mini        # 真正路由目標（之後要加 Claude 就在這裡多一筆）
      api_key: os.environ/OPENAI_API_KEY

  # Release-evidence real-model lane only: a fixed provider snapshot, never a
  # floating alias. The evidence wrapper records this deployment identifier.
  - model_name: evidence-gpt-4o-mini-2024-07-18
    litellm_params:
      model: openai/gpt-4o-mini-2024-07-18
      api_key: os.environ/OPENAI_API_KEY

  - model_name: text-embedding-3-small # mem0 的 embedder 與工作流服務的 RAG 嵌入都走這裡
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

  - model_name: mock-gpt               # 開發用：沒有 OpenAI 額度時，用固定回覆驗證 SSE 串流鏈路
    litellm_params:
      model: openai/gpt-4o-mini        # 有 mock_response 時不會真的打 OpenAI
      mock_response: "這是一段由 LiteLLM 模擬的回覆，用來在沒有 OpenAI 額度時驗證 SSE 逐字串流是否正常。Streaming works! 0123456789，繁體中文也沒問題。"

litellm_settings:
  success_callback: ["langfuse"]       # 成功呼叫 → Langfuse
  failure_callback: ["langfuse"]       # 失敗呼叫 → Langfuse
  drop_params: true                    # 自動丟掉供應商不支援的參數，避免相容性錯誤

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY   # 虛擬金鑰；各服務端經 LITELLM_KEY env 讀取（預設 sk-1234，見 .env.example）

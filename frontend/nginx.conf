server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # pdf.js 的 worker chunk 是 .mjs;基底映像的 mime.types 沒有此副檔名,
    # 預設會以 application/octet-stream 送出,瀏覽器嚴格模組 MIME 檢查會拒載。
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    # 縱深防禦標頭(JWT 存在 localStorage,沒有 httpOnly 保護)。用 always 讓錯誤回應也帶上。
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    # CSP:全站同源。worker-src 允許 blob: 是給 pdf.js 的 worker;style-src 的 'unsafe-inline'
    # 是必要的(CopilotKit 與 React inline style 都會注入);connect-src 'self' 足夠,因為所有
    # API 都經同源 nginx 反代到 platform。script-src 永遠不得放寬成 'unsafe-eval'/'unsafe-inline'
    # ——真的擋到功能就整條 CSP 移除並回報,不是放寬 script-src。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # SPA 路由：找不到實體檔案就回 index.html，交給前端路由處理。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理到 platform 容器（走 compose 服務名 platform:8080，容器間直連，不經主機）。
    # 副駕的 AG-UI(/api/copilot/agui,SSE)也走此規則直達 platform。
    # 取代開發時 Vite 的 proxy，瀏覽器仍是同源請求，免 CORS。
    location /api/ {
        proxy_pass http://platform:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 串流關鍵：關閉緩衝，否則 /api/chat/stream 會被 nginx 整段緩衝、無法逐字吐。
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

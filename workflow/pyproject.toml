[project]
name = "springaitest-workflow"
version = "0.1.0"
description = "LangGraph 工作流服務：以具名工作流承載多步驟 LLM 任務，透過 HTTP 供 Spring 後端觸發。"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "langgraph>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "pydantic-settings>=2.6,<3.0",
    "langfuse>=3.0,<4.0",
    # langfuse.langchain.CallbackHandler 內部 import langchain，需完整套件（僅 langchain-core 不夠）
    "langchain>=1.0,<2.0",
    # 資料檢索改呼叫 backend 的 /api/retrieval/search（核心商業邏輯與向量庫都搬到 backend/）
    "httpx>=0.27,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

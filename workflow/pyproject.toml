[project]
name = "springaitest-workflow"
version = "0.1.0"
description = "LangGraph 工作流服務：以具名工作流承載多步驟 LLM 任務，透過 HTTP 供 Spring 後端觸發。"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "langgraph>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "pydantic-settings>=2.6,<3.0",
    "langfuse>=3.0,<4.0",
    # langfuse.langchain.CallbackHandler 內部 import langchain，需完整套件（僅 langchain-core 不夠）
    "langchain>=1.0,<2.0",
    # RAG 向量檢索：PgVectorStore 走 psycopg3 async 連線池 + pgvector 型別/運算子
    "psycopg[binary]>=3.2,<4",
    "psycopg_pool>=3.2,<4",
    "pgvector>=0.3,<1",
    # langchain_core.embeddings.DeterministicFakeEmbedding 內部以 numpy 產生向量，
    # 本身未把 numpy 列為必要相依套件，因此在這裡明確加上，"fake" 嵌入模式才能正常運作
    "numpy>=1.26,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.uv]
package = false

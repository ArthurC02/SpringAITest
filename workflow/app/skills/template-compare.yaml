name: template-compare            # __SLOT_name__
description: 比對排序範本骨架        # __SLOT_description__
required_role: USER

input_schema:
  query: {type: str, required: true, min_length: 1}

# 薄檢索(登記 → 通用 retrieve)後接 nl_logic:把檢索到的 docs 餵給 LLM,由使用者的
# 自然語言規則(instruction)解讀並做比對排序,結果寫回 business_result。
# retrieve 用通用 retrieve@1.0,檢索筆數由骨架顯式帶純量槽(retrieve.py 讀的是模組全域
# settings.retrieval_top_k,不經 deps,所以覆寫值必須組譯期填進那一行)。
# 商業邏輯槽現為自然語言規則(nl_logic 的 instruction);舊 script 槽(要作者寫 Python)已廢,
# sort_by 純量槽隨之刪除(它是 script 內的 Python 區域變數,無 script 即無意義)。
flow:
  - node: query_intake@1.0
  - node: retrieve@1.0
    params:
      query_key: query
      top_k: 8                    # __SLOT_topK__

  # 商業邏輯槽(nl_logic):input_keys 把檢索結果 docs 餵進 LLM。
  # 規則槽獨佔一行、位於 block literal(|)內,compose 期整行換成比對排序規則。
  - node: nl_logic@1.0
    params:
      input_keys: [docs]
      instruction: |
        __RULE_SLOT__

name: template-inspire            # __SLOT_name__
description: 啟發範本骨架            # __SLOT_description__
required_role: USER

input_schema:
  query: {type: str, required: true, min_length: 1}

# 同 infer 的薄檢索 → nl_logic 形狀,由使用者的自然語言規則(instruction)綜合檢索到的
# docs、產出啟發性的觀點並寫回 business_result。
flow:
  - node: query_intake@1.0
  - node: retrieve@1.0
    params:
      query_key: query

  # 商業邏輯槽(nl_logic):input_keys 把檢索結果 docs 餵進 LLM。
  # 規則槽獨佔一行、位於 block literal(|)內,compose 期整行換成啟發規則。
  - node: nl_logic@1.0
    params:
      input_keys: [docs]
      instruction: |
        __RULE_SLOT__

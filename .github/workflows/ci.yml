name: CI

# 五個 job 都只需要讀 repo,不給 GITHUB_TOKEN 任何寫入權
permissions:
  contents: read

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # main 上不取消（要保留每個 commit 的紀錄），分支/PR 只跑最新一次
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # backend/AGENTS.md：`dotnet test`（從 backend/），需要 appdb
  # (預設 DB_CONNECTION_STRING = Host=localhost;Port=5433;...;Database=springaitest)。
  # PostgresFixture 在 DB 不可達時會 skip 而非 fail，所以 CI 必須真的把 DB 開起來，
  # 否則整批 PostgreSQL 測試會靜默消失。service container 每次 run 都是全新空 DB。
  backend:
    runs-on: ubuntu-latest
    services:
      appdb:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: springaitest
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-backend-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Build.props') }}
          restore-keys: nuget-backend-
      # 防呆:PostgresFixture 在 DB 不可達時誠實 skip(綠但沒跑)。這一步讓
      # 容器壞掉/憑證漂移直接紅,而不是 20+ 個 repository 測試靜默消失。
      - name: appdb must be reachable
        run: psql "postgresql://postgres:postgres@localhost:5433/springaitest" -c 'select 1'
      - run: dotnet test
        working-directory: backend

  # platform/AGENTS.md：`dotnet test`（從 platform/）。無 DB 依賴（fakes + WebApplicationFactory）。
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-platform-${{ hashFiles('platform/**/*.csproj', 'platform/Directory.Build.props') }}
          restore-keys: nuget-platform-
      - run: dotnet test
        working-directory: platform

  # workflow/AGENTS.md：uv + `uv run pytest`（從 workflow/），pyproject requires-python >= 3.12。
  # 註：CHECKPOINT_DATABASE_URL 未設，真 PostgreSQL checkpointer 測試仍會 skip
  # （見 workflow/AGENTS.md「The default skips hide the only production checkpointer」）。
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: workflow/uv.lock
      - run: uv run pytest -q
        working-directory: workflow

  # frontend/AGENTS.md：npm ci / lint / build / test:unit（package.json 無 engines，用 Node 22 LTS）。
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit:logic
      # = npm run test:unit:ui，但 playwright.unit.config.ts 沒有 retries 設定，
      # 而 agentBuilder/agentRuns 有已知的全套並行資源競爭 flake。CI 用 CLI flag 補一次重試，
      # 不動 config 檔（本機仍是零重試，flake 會被看見）。
      - run: npx playwright test --config playwright.unit.config.ts --retries=1

  compose-and-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git diff --check 需要 PR base commit
      # infra/.env 不進版控，用 .env.example 當 CI 的 env-file（純語法展開驗證，不啟動服務）。
      # 三個 ${VAR:?} 必填變數（evidence 檔）在此給假值，缺了會讓整份展開失敗。
      - name: Compose expansion
        env:
          EVIDENCE_HMAC_KEY: ci-not-a-secret
          EVIDENCE_CHECKPOINT_HMAC_KEY: ci-not-a-secret
          EVIDENCE_DB_NAME: ci_evidence
        run: |
          env -u ASPNETCORE_ENVIRONMENT -u APP_ENVIRONMENT docker compose --profile '*' --env-file /dev/null -f infra/docker-compose.yml config --format json > "$RUNNER_TEMP/compose-base-production.json"
          env -u ASPNETCORE_ENVIRONMENT -u APP_ENVIRONMENT docker compose --profile '*' --env-file /dev/null -f infra/docker-compose.yml -f infra/docker-compose.evidence.yml config --format json > "$RUNNER_TEMP/compose-evidence-production.json"
          docker compose --profile '*' --env-file infra/.env.example -f infra/docker-compose.yml config --format json > "$RUNNER_TEMP/compose-base-development.json"
          docker compose --profile '*' --env-file infra/.env.example -f infra/docker-compose.yml -f infra/docker-compose.evidence.yml config --format json > "$RUNNER_TEMP/compose-evidence-development.json"
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          environment_expectations = {
              "compose-base-production.json": ("Production", {
                  "platform": ("ASPNETCORE_ENVIRONMENT", "Production"),
                  "backend": ("ASPNETCORE_ENVIRONMENT", "Production"),
                  "workflow": ("APP_ENVIRONMENT", "Production"),
              }),
              "compose-evidence-production.json": ("Production", {
                  "platform": ("ASPNETCORE_ENVIRONMENT", "Production"),
                  "backend": ("ASPNETCORE_ENVIRONMENT", "Production"),
                  "workflow": ("APP_ENVIRONMENT", "Production"),
                  "platform-evidence": ("ASPNETCORE_ENVIRONMENT", "Production"),
                  "backend-evidence": ("ASPNETCORE_ENVIRONMENT", "Production"),
                  "workflow-evidence": ("APP_ENVIRONMENT", "Production"),
              }),
              "compose-base-development.json": ("Development", {
                  "platform": ("ASPNETCORE_ENVIRONMENT", "Development"),
                  "backend": ("ASPNETCORE_ENVIRONMENT", "Development"),
                  "workflow": ("APP_ENVIRONMENT", "Development"),
              }),
              "compose-evidence-development.json": ("Development", {
                  "platform": ("ASPNETCORE_ENVIRONMENT", "Development"),
                  "backend": ("ASPNETCORE_ENVIRONMENT", "Development"),
                  "workflow": ("APP_ENVIRONMENT", "Development"),
                  "platform-evidence": ("ASPNETCORE_ENVIRONMENT", "Development"),
                  "backend-evidence": ("ASPNETCORE_ENVIRONMENT", "Development"),
                  "workflow-evidence": ("APP_ENVIRONMENT", "Development"),
              }),
          }

          configs = {}
          for filename, (environment, services) in environment_expectations.items():
              path = os.path.join(os.environ["RUNNER_TEMP"], filename)
              with open(path, encoding="utf-8") as stream:
                  config = json.load(stream)
              configs[filename] = config
              for service, (key, wanted) in services.items():
                  if wanted != environment:
                      raise SystemExit(f"{filename}: inconsistent expected environment {wanted!r}")
                  actual = config["services"][service].get("environment", {}).get(key)
                  if actual != wanted:
                      raise SystemExit(
                          f"{filename}: {service}.{key} must be {wanted!r}, got {actual!r}"
                      )

          jwt_contract = {
              "compose-base-development.json": {
                  "platform": {"JWT_ISSUER", "JWT_AUDIENCE", "JWT_PUBLIC_KEY_RING_JSON"},
                  "backend": {"JWT_ISSUER", "JWT_AUDIENCE", "JWT_ACTIVE_KID", "JWT_PRIVATE_KEY_PEM_BASE64"},
              },
              "compose-evidence-development.json": {
                  "platform": {"JWT_ISSUER", "JWT_AUDIENCE", "JWT_PUBLIC_KEY_RING_JSON"},
                  "backend": {"JWT_ISSUER", "JWT_AUDIENCE", "JWT_ACTIVE_KID", "JWT_PRIVATE_KEY_PEM_BASE64"},
                  "platform-evidence": {"JWT_ISSUER", "JWT_AUDIENCE", "JWT_PUBLIC_KEY_RING_JSON"},
                  "backend-evidence": {"JWT_ISSUER", "JWT_AUDIENCE", "JWT_ACTIVE_KID", "JWT_PRIVATE_KEY_PEM_BASE64"},
              },
          }
          for filename, services in jwt_contract.items():
              for name, required in services.items():
                  environment = configs[filename]["services"][name].get("environment", {})
                  missing = {key for key in required if not environment.get(key)}
                  if missing:
                      raise SystemExit(f"{filename}: {name} is missing JWT contract keys: {sorted(missing)}")
                  if name.startswith("platform") and "JWT_PRIVATE_KEY_PEM_BASE64" in environment:
                      raise SystemExit(f"{filename}: private JWT material must not enter {name}")
                  if name.startswith("backend") and "JWT_PUBLIC_KEY_RING_JSON" in environment:
                      raise SystemExit(f"{filename}: Backend must receive signing configuration, not a public ring")

          jwt_keys = {
              "JWT_ISSUER", "JWT_AUDIENCE", "JWT_ACTIVE_KID",
              "JWT_PRIVATE_KEY_PEM_BASE64", "JWT_PUBLIC_KEY_RING_JSON",
          }
          for filename in ("compose-base-production.json", "compose-evidence-production.json"):
              for name in jwt_contract[filename.replace("production", "development")]:
                  environment = configs[filename]["services"][name].get("environment", {})
                  if any(environment.get(key) for key in jwt_keys):
                      raise SystemExit(f"{filename}: raw Production config must not inject development JWT material into {name}")

          hardened = {
              "compose-base-development.json": {
                  "frontend": "101",
                  "platform": "app",
                  "backend": "app",
                  "workflow": "appuser",
              },
              "compose-evidence-development.json": {
                  "frontend": "101",
                  "platform": "app",
                  "backend": "app",
                  "workflow": "appuser",
                  "platform-evidence": "app",
                  "backend-evidence": "app",
                  "workflow-evidence": "appuser",
                  "evidence-model": "evidence",
                  "workflow-capture-proxy": "evidence",
                  "evidence-nginx": "101",
                  "frontend-evidence": "101",
              },
          }

          for filename, services in hardened.items():
              config = configs[filename]
              for name, wanted_user in services.items():
                  service = config["services"][name]
                  tmpfs = service.get("tmpfs", [])
                  if isinstance(tmpfs, str):
                      tmpfs = [tmpfs]
                  checks = {
                      "user": service.get("user") == wanted_user,
                      "read_only": service.get("read_only") is True,
                      "no-new-privileges": "no-new-privileges:true" in service.get("security_opt", []),
                      "cap_drop=ALL": "ALL" in service.get("cap_drop", []),
                      "writable /tmp": any(entry.split(":", 1)[0] == "/tmp" for entry in tmpfs),
                      "healthcheck": bool(service.get("healthcheck", {}).get("test")),
                  }
                  failed = [label for label, passed in checks.items() if not passed]
                  if failed:
                      raise SystemExit(f"{filename}: {name} failed hardening checks: {', '.join(failed)}")

          expected_ports = {
              "frontend": 8080,
              "evidence-nginx": 8080,
              "frontend-evidence": 8080,
          }
          evidence = configs["compose-evidence-development.json"]
          for name, target in expected_ports.items():
              actual = {item["target"] for item in evidence["services"][name].get("ports", [])}
              if actual != {target}:
                  raise SystemExit(f"{name} container ports must remain {{{target}}}, got {actual}")

          dockerfile_users = {
              "platform/Dockerfile": "USER $APP_UID",
              "backend/Dockerfile": "USER $APP_UID",
              "frontend/Dockerfile": "USER 101",
              "workflow/Dockerfile": "USER appuser",
              "infra/evidence/Dockerfile": "USER evidence",
          }
          for path, directive in dockerfile_users.items():
              lines = {line.strip() for line in Path(path).read_text(encoding="utf-8").splitlines()}
              if directive not in lines:
                  raise SystemExit(f"{path}: missing non-root directive {directive!r}")

          for path in ("frontend/nginx.conf", "infra/evidence/nginx.conf"):
              if "listen 8080;" not in Path(path).read_text(encoding="utf-8"):
                  raise SystemExit(f"{path}: nginx must listen on unprivileged port 8080")

          local_image_refs = {"springaitest-mem0:latest"}
          pinned_image = re.compile(r":([^/@]+)@sha256:[0-9a-f]{64}$")
          for filename in ("compose-base-development.json", "compose-evidence-development.json"):
              for name, service in configs[filename]["services"].items():
                  image = service.get("image")
                  if not image or service.get("build") or image in local_image_refs:
                      continue
                  if not pinned_image.search(image):
                      raise SystemExit(
                          f"{filename}: external image for {name} must retain a readable tag and pin an index digest"
                      )

          legacy_jwt_markers = ("JWT_SECRET", '"alg":"HS256"', "New-EvidenceJwt", "JwtSecret")
          jwt_contract_paths = [Path("infra/docker-compose.yml"), Path("infra/docker-compose.evidence.yml")]
          jwt_contract_paths.extend(Path("scripts").glob("*.ps1"))
          jwt_contract_paths.extend(Path("scripts").glob("*.sh"))
          for path in jwt_contract_paths:
              content = path.read_text(encoding="utf-8")
              found = [marker for marker in legacy_jwt_markers if marker in content]
              if found:
                  raise SystemExit(f"{path}: obsolete JWT contract marker(s): {', '.join(found)}")
          PY
      - name: Resource calibration contract
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_resource_calibration.py' -v
          python3 scripts/resource_calibration.py validate --inventory infra/resource-calibration-inventory.json
          python3 scripts/resource_calibration.py validate-compose \
            --inventory infra/resource-calibration-inventory.json \
            --base-production-json "$RUNNER_TEMP/compose-base-production.json" \
            --evidence-production-json "$RUNNER_TEMP/compose-evidence-production.json" \
            --base-development-json "$RUNNER_TEMP/compose-base-development.json" \
            --evidence-development-json "$RUNNER_TEMP/compose-evidence-development.json"
      - name: Shell syntax
        run: git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n
      # 根 AGENTS.md：所有 *.sh 必須是 LF，CRLF shebang 會讓 Linux build image 裡的 ./script.sh 報 not found。
      - name: Shell scripts must be LF
        run: |
          if git ls-files --eol -- '*.sh' | grep -q 'crlf'; then
            echo "CRLF found in shell scripts:"
            git ls-files --eol -- '*.sh' | grep 'crlf'
            exit 1
          fi
      # 只看 PR 自己的 diff（首次全量匯入不追溯歷史）。排除 *.md：Markdown 行尾兩個空白
      # 是刻意的硬換行語法，git diff --check 會把它誤報成 trailing whitespace。
      - name: Diff hygiene
        if: github.event_name == 'pull_request'
        run: git diff --check ${{ github.event.pull_request.base.sha }}...HEAD -- . ':(exclude)*.md'

  container-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash ./scripts/verify-container-hardening.sh

  full-chain-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: springaitest-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic full-chain smoke
        shell: pwsh
        run: ./scripts/verify-copilot-shared-core.ps1 -Rebuild -CiComposeSubset
      - name: Clean up this job's Compose resources
        if: always()
        working-directory: infra
        run: docker compose --env-file .env.example --profile full down --remove-orphans

  # TODO(WP1-CI): 契約 snapshot 比對。各服務內以 snapshot test 形式實作
  # （backend/platform xUnit、workflow pytest），因此會直接落在上面既有的
  # dotnet test / uv run pytest 步驟裡，不需要獨立 job；若之後改為跨服務比對
  # 的獨立產物 diff，再在這裡新增一個 job。
